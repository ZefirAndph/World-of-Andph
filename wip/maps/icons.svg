<!-- Grids 50x50 -->
<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <desc>
        Dokumentace SVG
        https://developer.mozilla.org/en-US/docs/Web/SVG/Reference/Element/style
    </desc>
    <defs>
        <symbol id="check" viewBox="0 0 24 24">
            <path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>
        </symbol>

        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
            <circle cx="5" cy="5" r="4" fill="red"/>
        </marker>

        <symbol id="city" viewBox="-10 -10 20 20" height="20" width="20">
            <circle cx="0" cy="0" r="10" fill="red"/>
        </symbol>

        <symbol id="cross" viewBox="-10 -10 20 20">
           <line x1="-10" y1="10" x2="10" y2="-10" stroke="blue" stroke-width=".1"/>
           <line x1="-10" y1="-10" x2="10" y2="10" stroke="blue" stroke-width=".1"/>
        </symbol>
    </defs>

    <use href="#check"/>
        
</svg>