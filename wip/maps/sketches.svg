<!-- Grids 50x50 -->
<svg viewBox="-250 -250 500 500" xmlns="http://www.w3.org/2000/svg">
    <desc>
        https://developer.mozilla.org/en-US/docs/Web/SVG/Reference/Element/style
    </desc>
    <defs>
        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
            <circle cx="5" cy="5" r="4" fill="green" stroke="yellow" stroke-width="1"/>
        </marker>

        <symbol id="city" viewBox="-10 -10 20 20" height="20" width="20">
            <circle cx="0" cy="0" r="10" fill="red"/>
        </symbol>

        <symbol id="cross" viewBox="-10 -10 20 20">
           <line x1="-10" y1="10" x2="10" y2="-10" stroke="blue" stroke-width=".1"/>
           <line x1="-10" y1="-10" x2="10" y2="10" stroke="blue" stroke-width=".1"/>
        </symbol>
    </defs>

  <path d="M 0,0 L 10,0 L 10,-40 L 15,-40 L 15,-45 L 10,-45 L 0,-45" fill="red" stroke="red" marker-start="url(#dot)"
              marker-mid="url(#dot)"
              marker-end="url(#dot)"/>
           <!-- A 20,20 0,0,1 50,30
           A 20,20 0,0,1 90,30
           Q 90,60 50,90
           Q 10,60 10,30 -->
