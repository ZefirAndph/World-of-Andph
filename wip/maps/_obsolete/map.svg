  <style
     id="stylesheet">.desert { fill:#e3c88a; }
.desert-rock { fill:#c9a86a; }
.forest { fill:#5b7a4f; }
.forest-light { fill:#7a9668; }
.forest-stroke { stroke:#3f5638;    stroke-width:1,5; }
.label { fill: white;            text-anchor: middle;            font-size: 100; }
.land { fill:#e8dfc4; }
.land-fertile { fill:#d4dba0; }
.mountain { fill:#a89890; }
.mountain-outline { stroke-width:1,5;    stroke:#6b5e56; }
.mountain-peak { fill:#d8d2c8; }
.river { fill:#5ba3c7;    stroke:#3d7a99;    stroke-width:2; }
.road { fill: none; stroke: #8b6f47; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.road-minor { fill: none; stroke: #a68a5f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 3; }
.road-outline { fill: none; stroke: #5c4a30; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.sea { fill:#a6cfe0; }
<!-- .settlement-city { fill: #b5453a; stroke: #7a2e26; stroke-width: 1.5; }-->
