.sketch { stroke:black;    fill-opacity:0;    stroke-opacity:0.5;    stroke-width:5; }
text.area_label { fill:black;    font-family:ink free;    font-size:250px;    text-anchor:middle; }
<!-- Settlements -->
circle.settlement { radius: 30px; fill: #b5453a; stroke: #7a2e26; stroke-width: 1.5; }
circle.city { radius: 30px; fill: #b5453a; stroke: #7a2e26; stroke-width: 1.5; }
text.settlement { fill: #7a6e66; font-family:ink free;; }
</style>
