<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
    <style>
        .grid { stroke: #ccc; stroke-width: 0.5; }
        .grid-base { stroke: #ccc; stroke-width: 1; }
        polyline.line { stroke-width: 5; fill: none; marker-start:url(#dot); marker-mid:url(#dot); marker-end:url(#dot)}
    </style>
    <defs>
        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
            <circle cx="5" cy="5" r="4" fill="context-stroke"/>
        </marker>
    </defs>

    <rect x="0" y="0" width="480" height="300" fill="#eee"/>
    <text x="240" y="20" font-size="16" text-anchor="middle">Nadpis</text>

    <g id="HorizontalGrid">
        <line class="grid" x1="30" x2="450" y1="30" y2="30"/>
        <line class="grid" x1="30" x2="450" y1="90" y2="90"/>
        <line class="grid" x1="30" x2="450" y1="150" y2="150"/>
        <line class="grid" x1="30" x2="450" y1="210" y2="210"/>
        <line class="grid-base" x1="30" x2="450" y1="270" y2="270"/>
    </g>
    <g id="VerticalGrid">
        <line class="grid-base" x1="30" x2="30" y1="30" y2="270"/>
        <line class="grid" x1="135" x2="135" y1="30" y2="270"/>
        <line class="grid" x1="240" x2="240" y1="30" y2="270"/>
        <line class="grid" x1="345" x2="345" y1="30" y2="270"/>
        <line class="grid" x1="450" x2="450" y1="30" y2="270"/>
    </g>
    <g id="VerticalLabels">
        <text x="25" y="33" font-size="10" text-anchor="end">100</text>
        <text x="25" y="93" font-size="10" text-anchor="end">75</text>
        <text x="25" y="153" font-size="10" text-anchor="end">50</text>
        <text x="25" y="213" font-size="10" text-anchor="end">25</text>
        <text x="25" y="273" font-size="10" text-anchor="end">0</text>
    </g>
    <g id="HorizontalLabels">
        <text x="30" y="285" font-size="10" text-anchor="middle">0</text>
        <text x="135" y="285" font-size="10" text-anchor="middle">25</text>
        <text x="240" y="285" font-size="10" text-anchor="middle">50</text>
        <text x="345" y="285" font-size="10" text-anchor="middle">75</text>
        <text x="450" y="285" font-size="10" text-anchor="middle">100</text>
    </g>
    <svg x="30" y="30" width="420" height="240" viewBox="0 0 2100 1200">
        <polyline stroke="blue" class="line" points="0,600 100,430 200,420 300,340 400,754 500,354"/>
        <polyline class="line" stroke="green" points="0,900 100,540 200,310 300,380 400,-500 500,782"/>
    </svg>
</svg>